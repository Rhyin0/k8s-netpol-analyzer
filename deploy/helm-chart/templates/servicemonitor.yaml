{{- if .Values.serviceMonitor.enabled }}
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-analyzer
  namespace: {{ .Release.Namespace }}
  labels:
    app: netpol-analyzer
spec:
  selector:
    matchLabels:
      app: netpol-analyzer
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.scrapeInterval }}
{{- end }}
{{- end }}
